# SonarCloud automatic analysis reads only the keys below
# (https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/).
# Rules themselves (for instance css:S9423, `!important`, which overriding
# Vuetify 2 needs) are switched off in the project's quality profile on
# sonarcloud.io, not here.

# Our code. Left out: public/source and the fonts and skins of public/
# (vendored Smart tree, Material Design Icons, Font Awesome, TinyMCE),
# template-example (sample templates), docs (design-system previews), and the
# Mosaico specs vendored with the editor.
sonar.sources=packages,scripts,public/lang,nuxt.config.js,gulpfile.js,jest.config.js,vuetify.options.js
sonar.exclusions=packages/editor/spec/**,packages/documentation/**
sonar.tests=tests

# Duplication that is the design, not a smell:
# - tests repeat their arrange so each one reads alone;
# - each locale file mirrors the others key by key (fr, en, the editor's).
sonar.cpd.exclusions=tests/**,packages/ui/helpers/locales/**,public/lang/**,locales/**
