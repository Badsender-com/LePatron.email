<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choisir la cible du commentaire</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#093040}a:hover{color:#00acdc}
.p{width:360px;height:680px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#111827;font-size:13px;line-height:1.5}
.ph{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid #e5e7eb}
.pt{font-size:15px;font-weight:600;color:#093040}
.pb{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:10px}
.pf{flex-shrink:0;border-top:1px solid #e5e7eb;background:#f9fafb;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ib{width:32px;height:32px;border:none;border-radius:5px;background:transparent;color:#6b7280;display:inline-flex;align-items:center;justify-content:center;padding:0;font:inherit}
.cnt{min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#00acdc;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.chip{height:28px;padding:0 10px;box-sizing:border-box;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;background:#fff;border:1px solid #e5e7eb;color:#374151;font-family:inherit}
.chip-on{background:rgba(0,172,220,0.10);border-color:#00acdc;color:#093040}
.card{border:1px solid #e5e7eb;border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.who{font-size:13px;font-weight:600}
.when{font-size:11.5px;color:#6b7280}
.tag{font-size:11px;font-weight:500;color:#374151;background:#f3f4f6;border-radius:5px;padding:2px 6px;white-space:nowrap}
.ctx{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280}
.sel{height:30px;padding:0 8px 0 10px;border:1px solid #e5e7eb;border-radius:5px;background:#fff;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;color:#111827;box-sizing:border-box}
.sel .k{color:#6b7280}
.btn{height:36px;padding:0 14px;border-radius:5px;font-family:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;box-sizing:border-box}
.btn-p{background:#00acdc;color:#fff;border:1px solid #00acdc}
.ta{min-height:60px;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:5px;background:#fff;padding:8px 10px;font-size:13px;color:#1f2937}
.mi{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:5px;background:none;border:none;font-family:inherit;text-align:left;width:100%;box-sizing:border-box}
</style>
</helmet>
<div class="p" style="width: 360px; height: 680px">
<div class="ph"><span class="pt">Commentaires</span><span class="cnt" aria-label="2 non résolus">2</span><div style="flex: 1"></div><button class="ib" aria-label="Fermer le panneau"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>

<div class="pb">
<div style="display: flex; gap: 6px" role="group" aria-label="Afficher">
<button class="chip chip-on" aria-pressed="true">Tous · 3</button>
<button class="chip" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>Cover · 1</button>
</div>
<div class="card" style="opacity: 0.6">
<div style="display: flex; align-items: center; gap: 8px"><span class="who">Thomas Bernard</span><span class="when">hier</span><div style="flex: 1"></div><span class="tag">Général</span></div>
<div class="ctx"><span>Tout l'email</span></div>
<div style="color: #1f2937">On garde l'objet proposé par l'IA ou on revient au nôtre ?</div>
</div>
</div>

<div class="pf">
<div class="ta">Le bandeau mobile coupe le titre en deux lignes.</div>
<div style="position: relative">
<div role="listbox" aria-label="Cible du commentaire" style="position: absolute; left: 0; right: 0; bottom: 36px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 7px; box-shadow: 0 4px 12px rgba(13,43,62,0.12); padding: 6px; display: flex; flex-direction: column; gap: 2px">
<button class="mi" role="option" aria-selected="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; color: #111827">Tout l'email</span><span style="font-size: 12px; color: #6b7280">Commentaire global</span></span></button>
<button class="mi" role="option" aria-selected="true" style="background: rgba(0,172,220,0.10)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#093040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex-shrink: 0"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg><span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 13px; font-weight: 500; color: #093040">Cover · bloc 2</span><span style="font-size: 12px; color: #6b7280">Bloc sélectionné dans le canevas</span></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#093040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px"><path d="M20 6 9 17l-5-5"></path></svg></button>
<div style="border-top: 1px solid #eef0f3; margin: 4px -6px 0; padding: 8px 12px 4px; font-size: 12px; color: #6b7280; line-height: 1.45">La cible suit la sélection du canevas tant que vous ne la changez pas ici. Pour un autre bloc, sélectionnez-le dans l'email.</div>
</div>
<button class="sel" aria-expanded="true" aria-label="Cible du commentaire : Cover, bloc 2" style="width: 100%; border-color: #00acdc"><span class="k">Sur</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg><span style="font-weight: 500">Cover · bloc 2</span><span style="flex: 1"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button class="sel"><span class="k">Type</span>Design<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button class="sel"><span class="k">Priorité</span>Important<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="flex: 1"></div>
<button class="btn btn-p">Ajouter</button>
</div>
</div>
</div>
</x-dc>

</body>
</html>
