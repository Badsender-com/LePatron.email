<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The CSP the host is told of (mcp-preview-app.js), held by the app
      itself, whatever the host makes of it, and inherited by the email's
      `srcdoc` frame: no connection, and images from the site's origin only,
      written here as the resource is served.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{siteOrigin}} data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LePatron mailing preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: system-ui, sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        min-height: 120px;
        border: 0;
        background: #fff;
      }
      p {
        margin: 16px;
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p id="status">Loading the email…</p>
    <!--
      The email in a frame of its own: no `allow-scripts`, so nothing in it
      runs, whatever the sanitiser missed. `allow-same-origin` only lets this
      app measure it and catch its links.
    -->
    <iframe id="email" title="Email preview" sandbox="allow-same-origin" hidden></iframe>
    <script>
      (function () {
        // The email preview of get_mailing, as an MCP App (ADR 0012, #1342):
        // the host hands this app the tool's result, whose `_meta` carries the
        // sanitised preview the assistant never reads.
        var PROTOCOL_VERSION = '2026-01-26';
        var frame = document.getElementById('email');
        var status = document.getElementById('status');
        var nextId = 1;
        var pending = {};
        var shown = false;

        function send(message) {
          window.parent.postMessage(
            Object.assign({ jsonrpc: '2.0' }, message),
            '*'
          );
        }
        function request(method, params) {
          var id = nextId++;
          send({ id: id, method: method, params: params });
          return new Promise(function (resolve) {
            pending[id] = resolve;
          });
        }
        function notify(method, params) {
          send({ method: method, params: params });
        }

        function openLink(href) {
          if (window.openai && window.openai.openExternal) {
            window.openai.openExternal({ href: href });
          } else {
            request('ui/open-link', { url: href });
          }
        }

        // Where a link of the email leads, resolved, when it is a web page:
        // an HTML link, or an SVG one, whose address may be an `xlink:href`.
        var XLINK = 'http://www.w3.org/1999/xlink';
        function webAddressOf(link, doc) {
          var href =
            link.getAttribute('href') || link.getAttributeNS(XLINK, 'href');
          if (!href) return null;
          var url;
          try {
            url = new URL(href, doc.baseURI);
          } catch (error) {
            return null;
          }
          return url.protocol === 'http:' || url.protocol === 'https:'
            ? url.href
            : null;
        }

        function resize() {
          var doc = frame.contentDocument;
          if (!doc || !doc.documentElement) return;
          var height = doc.documentElement.scrollHeight;
          frame.style.height = height + 'px';
          notify('ui/notifications/size-changed', {
            height: document.documentElement.scrollHeight,
          });
        }

        // Where the preview travels: a key of LePatron's, in the result's
        // `_meta`, out of the namespace the MCP Apps spec keeps for itself.
        var PREVIEW_KEY = 'lepatron/previewHtml';
        var bound = false;

        function show(previewHtml) {
          if (typeof previewHtml !== 'string' || shown) return;
          shown = true;
          frame.onload = function () {
            var doc = frame.contentDocument;
            // Bound once, on the email itself: should anything ever navigate
            // the frame away, there is nothing to bind to.
            if (bound || !doc || doc.URL !== 'about:srcdoc') return;
            bound = true;
            // A link, or an image map's area, opens outside the
            // conversation, through the host; never inside the frame.
            // Every click in one is caught, whatever holds its address.
            doc.addEventListener(
              'click',
              function (event) {
                var link =
                  event.target.closest && event.target.closest('a, area');
                if (!link) return;
                event.preventDefault();
                var url = webAddressOf(link, doc);
                if (url) openLink(url);
              },
              true
            );
            // Clickable once its links are caught: `load` waits for every
            // image, and a link clicked before would navigate the frame.
            frame.style.pointerEvents = 'auto';
            resize();
          };
          frame.style.pointerEvents = 'none';
          frame.srcdoc = previewHtml;
          frame.hidden = false;
          status.hidden = true;
        }

        function showResult(result) {
          var meta = result && result._meta;
          var answer = result && result.structuredContent;
          if (meta && typeof meta[PREVIEW_KEY] === 'string') {
            show(meta[PREVIEW_KEY]);
          } else if (answer && typeof answer.html === 'string') {
            // Asked as HTML: the answer holds the preview itself.
            show(answer.html);
          } else if (!shown) {
            status.textContent = 'No preview: this mailing was never saved in the editor, or cannot be read.';
          }
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var message = event.data;
          if (!message || message.jsonrpc !== '2.0') return;
          // A response to this app's request; the host's requests have ids
          // of their own.
          if (!message.method && pending[message.id]) {
            pending[message.id](message.result);
            delete pending[message.id];
            return;
          }
          if (message.method === 'ui/notifications/tool-result') {
            showResult(message.params);
          } else if (message.method === 'ui/resource-teardown') {
            send({ id: message.id, result: {} });
          }
        });

        // ChatGPT hands the result through its own bridge too: its `_meta`
        // and its structured content.
        function fromOpenAi() {
          var openai = window.openai;
          if (openai && (openai.toolResponseMetadata || openai.toolOutput)) {
            showResult({
              _meta: openai.toolResponseMetadata,
              structuredContent: openai.toolOutput,
            });
          }
        }
        window.addEventListener('openai:set_globals', fromOpenAi);
        fromOpenAi();

        request('ui/initialize', {
          protocolVersion: PROTOCOL_VERSION,
          appInfo: { name: 'lepatron-mailing-preview', version: '1.0.0' },
          appCapabilities: {},
        }).then(function () {
          notify('ui/notifications/initialized', {});
        });
      })();
    </script>
  </body>
</html>
