<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="{%=o.lang%}" xml:lang="{%=o.lang%}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title>{%=o.t.title%}</title>
  <!--[if gte mso 9]>
  <xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <![endif]-->
  <!--[if !mso]><!-->
  <style type="text/css">
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuFuYAZ9hiJ-Ek-_EeA.woff2) format('woff2'); }
  </style>
  <!--<![endif]-->
  <style type="text/css">
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    a { color: #093040; }
    a:active { opacity: 0.8; }
    .button:hover { background-color: #265090 !important; }
    @media only screen and (max-width: 600px) {
      .card { width: 100% !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
      .button { width: auto !important; }
    }
    @media (prefers-color-scheme: dark) {
      body, .page { background-color: #0a1a21 !important; }
      .card { background-color: #102731 !important; }
      .text, .brand, h1 { color: #f2f6f8 !important; }
      .muted { color: #b8c7ce !important; border-color: #2a4552 !important; }
      a { color: #7fd3f0 !important; }
      .button { background-color: #00acdc !important; color: #04202b !important; }
      .button:hover { background-color: #7fd3f0 !important; }
    }
  </style>
</head>
<body class="page" style="margin: 0; padding: 0; background-color: #f4f6f7; direction: ltr;">
  <span class="preheader" style="display: none !important; visibility: hidden; opacity: 0; color: transparent; font-size: 1px; line-height: 1px; max-height: 0; max-width: 0; overflow: hidden; mso-hide: all;">{%=o.t.preheader%}</span>
  <div role="article" lang="{%=o.lang%}" dir="ltr" style="direction: ltr;">
    <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6f7" style="background-color: #f4f6f7;">
      <tr>
        <td align="center" style="padding: 24px 12px;">
          <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 600px; max-width: 600px; background-color: #ffffff;">
            <tr>
              <td class="pad" style="padding: 32px 40px 0 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding-right: 12px;"><img src="{%=o.logo%}" alt="" role="presentation" width="40" height="40" style="display: block; border: 0;"/></td>
                    <td class="brand" style="font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 20px; line-height: 30px; font-weight: 700; color: #093040; text-align: left; mso-line-height-rule: exactly;">LePatron</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="pad" style="padding: 32px 40px 0 40px;">
                <h1 class="text" style="margin: 0; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 24px; line-height: 36px; font-weight: 700; color: #141414; text-align: left; mso-line-height-rule: exactly;">{%=o.t.title%}</h1>
              </td>
            </tr>
            <tr>
              <td class="pad text" style="padding: 16px 40px 0 40px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #141414; text-align: left; mso-line-height-rule: exactly;">{%=o.t.desc%}</td>
            </tr>
            {% if (o.url) { %}
            <tr>
              <td class="pad" style="padding: 28px 40px 0 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td class="button" align="center" bgcolor="#093040" style="background-color: #093040; border-radius: 5px;">
                      <a class="button" href="{%=o.url%}" style="display: block; padding: 14px 24px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 16px; line-height: 24px; font-weight: 700; color: #ffffff; text-decoration: none; text-align: center; mso-line-height-rule: exactly;">{%=o.t.button%}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="pad muted" style="padding: 16px 40px 0 40px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #4a5a62; text-align: left; word-break: break-all; mso-line-height-rule: exactly;">{%=o.c.fallback%} <a href="{%=o.url%}" style="text-decoration: underline;">{%=o.url%}</a></td>
            </tr>
            {% } %}
            <tr>
              <td class="pad" style="padding: 32px 40px 32px 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td class="muted" style="padding-top: 20px; border-top: 1px solid #dddcdc; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #4a5a62; text-align: left; mso-line-height-rule: exactly;">
                      <p style="margin: 0 0 8px 0;">{%=o.c.sent%}</p>
                      <p style="margin: 0;">{%=o.c.data%} <a href="{%=o.privacyUrl%}" style="text-decoration: underline;">{%=o.c.privacy%}</a> · <a href="mailto:{%=o.dpo%}" style="text-decoration: underline;">{%=o.dpo%}</a></p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
