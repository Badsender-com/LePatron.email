<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="{%=o.lang%}" xml:lang="{%=o.lang%}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="supported-color-schemes" content="light dark"/>
  <title>{%=o.t.title%}</title>
  <!--[if gte mso 9]>
  <xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <![endif]-->
  <!--[if !mso]><!-->
  <style type="text/css">
    /* Inter, as the application: one variable font for 400 to 700. */
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format('woff2'); }
  </style>
  <!--<![endif]-->
  <style type="text/css">
    /* The sign-in card of the application (docs/design-system): the secondary
       colour behind, a white card of 480 px with 10 px corners, the accent for
       the action. The hover darkens the accent, on the cell that is rounded. */
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    a { color: #093040; }
    a:active { opacity: 0.8; }
    .cta:hover { background-color: #0095c0 !important; }
    @media only screen and (max-width: 520px) {
      .wrap, .card { width: 100% !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
      .desc, .muted { font-size: 16px !important; line-height: 24px !important; }
      .actions { text-align: center !important; }
      .actions table { width: 100% !important; }
      .cta a { font-size: 16px !important; line-height: 24px !important; }
    }
    @media (prefers-color-scheme: dark) {
      body, .page { background-color: #0c1f38 !important; }
      .card { background-color: #102731 !important; }
      .title { color: #f2f6f8 !important; }
      .desc, .muted { color: #b8c7ce !important; }
      .rule { border-color: #2a4552 !important; }
      .card a { color: #7fd3f0 !important; }
      .card .cta a { color: #04202b !important; }
    }
  </style>
</head>
<body class="page" style="margin: 0; padding: 0; background-color: #265090; direction: ltr;">
  <span class="preheader" style="display: none !important; visibility: hidden; opacity: 0; color: transparent; font-size: 1px; line-height: 1px; max-height: 0; max-width: 0; overflow: hidden; mso-hide: all;">{%=o.t.preheader%}</span>
  <span aria-hidden="true" style="display: none !important; visibility: hidden; opacity: 0; color: transparent; font-size: 1px; line-height: 1px; max-height: 0; max-width: 0; overflow: hidden; mso-hide: all;">&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</span>
  <div role="article" lang="{%=o.lang%}" dir="ltr" style="direction: ltr;">
    <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#265090" style="background-color: #265090;">
      <tr>
        <td align="center" style="padding: 32px 12px 32px 12px;">
          <table role="presentation" width="480" class="wrap" cellpadding="0" cellspacing="0" border="0" style="width: 480px; max-width: 480px;">
            <tr>
              <td align="center" style="padding: 0 0 28px 0;"><img src="cid:{%=o.logoCid%}" alt="LePatron" width="190" style="display: block; width: 190px; height: auto; border: 0;"/></td>
            </tr>
            <tr>
              <td>
                <table role="presentation" width="100%" class="card" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 10px; box-shadow: 0 12px 32px rgba(13, 43, 62, 0.18);">
                  <tr>
                    <td class="pad" align="center" style="padding: 32px 32px 0 32px;"><img src="cid:{%=o.iconCid%}" alt="" role="presentation" width="56" height="56" style="display: block; width: 56px; height: 56px; border: 0;"/></td>
                  </tr>
                  <tr>
                    <td class="pad" align="center" style="padding: 16px 32px 0 32px;">
                      <h1 class="title" style="margin: 0; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 20px; line-height: 30px; font-weight: 600; color: #093040; text-align: center; mso-line-height-rule: exactly;">{%=o.t.title%}</h1>
                    </td>
                  </tr>
                  <tr>
                    <td class="pad desc" style="padding: 16px 32px 0 32px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #666666; text-align: left; mso-line-height-rule: exactly;">{%=o.t.desc%}</td>
                  </tr>
                  {% if (o.url) { %}
                  <tr>
                    <td class="pad muted" style="padding: 16px 32px 0 32px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #666666; text-align: left; mso-line-height-rule: exactly;">{%=o.c.fallback%} <a href="{%=o.url%}" style="text-decoration: underline; word-break: break-all;">{%=o.url%}</a></td>
                  </tr>
                  <tr>
                    <td class="pad" style="padding: 24px 32px 0 32px;">
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td class="rule" style="border-top: 1px solid #ebebeb; font-size: 1px; line-height: 1px;">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td class="pad actions" align="right" style="padding: 16px 32px 24px 32px; text-align: right;">
                      <table role="presentation" align="right" cellpadding="0" cellspacing="0" border="0" style="margin-left: auto;">
                        <tr>
                          <td class="cta" align="center" bgcolor="#00acdc" style="background-color: #00acdc; border-radius: 4px; mso-padding-alt: 12px 24px;">
                            <a href="{%=o.url%}" style="display: block; padding: 12px 24px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 24px; font-weight: 600; color: #04202b; text-decoration: none; text-align: center; mso-line-height-rule: exactly;">{%=o.t.button%}</a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  {% } else { %}
                  <tr>
                    <td style="font-size: 1px; line-height: 24px;">&nbsp;</td>
                  </tr>
                  {% } %}
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 24px 12px 0 12px; font-family: 'Inter', Tahoma, Arial, sans-serif; font-size: 14px; line-height: 21px; color: #ffffff; text-align: center; mso-line-height-rule: exactly;">
                <p style="margin: 0 0 8px 0;">{%=o.c.sent%}</p>
                <p style="margin: 0;">{%=o.c.data%} <a href="{%=o.privacyUrl%}" style="color: #ffffff; text-decoration: underline;">{%=o.c.privacy%}</a> {%=o.c.or%} <a href="mailto:{%=o.dpo%}" style="color: #ffffff; text-decoration: underline;">{%=o.dpo%}</a>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
