<!-- ko if: $root.titleMode() == 'edit' || $root.titleMode() == 'saving' -->
<form class="creation-name" data-bind="submit: saveEditCreationName, submitBubble: false">
  <input type="text" data-bind="attr: { 'aria-label': $root.t('topbar-rename') }, value: $root.metadata.name, event: { keydown: function(d, e) { if (e.key === 'Escape') { $root.cancelEditCreationName(); return false; } return true; } }, disable: $root.titleMode() == 'saving', hasFocus: $root.titleMode() == 'edit'"/>
  <button type="button" data-bind="click: cancelEditCreationName, clickBubble: false, disable: $root.titleMode() == 'saving',
  button: { refreshOn: $root.showPreviewFrame, icons: { primary: 'lucide lucide-fw lucide-x', secondary: null }, text: false, label: $root.t('edit-title-cancel') }">cancel</button>
  <button type="submit" data-bind="disable: $root.titleMode() == 'saving',
    button: { refreshOn: $root.showPreviewFrame, icons: { primary: 'lucide lucide-fw lucide-check-circle', secondary: null }, text: false, label: $root.t('edit-title-save') }">save</button>
</form>
<!-- /ko -->
<!-- ko if: $root.titleMode() == 'show' -->
<div class="creation-name">
  <!-- Renamed from a click on it, its pencil showing on hover (board
       « Repos — crayon au survol du nom »); plain text for whom may not. -->
  <!-- ko if: $root.canRenameCreation() -->
  <button type="button" class="creation-name__button" data-bind="click: enableEditCreationName, clickBubble: false, attr: { title: $root.t('topbar-rename'), 'aria-label': $root.t('topbar-rename') + ' : ' + $root.creationName() }">
    <span class="creation-name__text" data-bind="text: $root.creationName"></span>
    <span class="lucide lucide-pencil creation-name__pencil" aria-hidden="true"></span>
  </button>
  <!-- /ko -->
  <!-- ko ifnot: $root.canRenameCreation() -->
  <span class="creation-name__text" data-bind="text: $root.creationName"></span>
  <!-- /ko -->
</div>
<!-- /ko -->
