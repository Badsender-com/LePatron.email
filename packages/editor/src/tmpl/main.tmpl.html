<div id="page" style="display: none;" data-bind="visible: true, css: { withToolbox: $root.showToolbox, withRightPanel: $root.rightPanel && $root.rightPanel.anyOpen, 'is-both-preview': isBothPreview, 'is-desktop-preview': isDesktopPreview, 'is-mobile-preview': isMobilePreview }">

  <div id="main-edit-area" data-bind="click: function(obj, evt) { $root.selectBlock(null); $root.bsEventsHub.windowClick(evt); return true; }, clickBubble: false">
    <!-- ko withProperties: { templateMode: 'wysiwyg', templateModeFallback: 'show' } -->
    <div id="main-wysiwyg-area" data-bind="wysiwygScrollfix: true, scrollable: true, fudroppable: { active: draggingImage }, css: { isdragging: dragging, isdraggingimg: draggingImage }, block: content"></div>
    <!-- /ko -->

  </div>

  <!-- Comment markers rail: beside the email, a marker per block with unresolved comments (js/ext/comments/comments-rail.js) -->
  <!-- ko if: $root.commentsRail && $root.commentsRail.visible() -->
  <div class="comments-rail" data-bind="style: { left: $root.commentsRail.left() === null ? '' : $root.commentsRail.left() + 'px' }">
    <!-- ko foreach: $root.commentsRail.markers() -->
    <button type="button" class="rail-marker"
         data-bind="style: { top: view().position + 'px' },
                    css: {
                      'active': view().active,
                      'severity-blocking': view().maxSeverity === 'blocking',
                      'severity-important': view().maxSeverity === 'important'
                    },
                    click: function() { $root.commentsRail.open($data); },
                    attr: {
                      title: label,
                      'aria-current': view().active ? 'true' : null,
                      'aria-label': $root.t(view().count === 1 ? 'comments-rail-marker-one' : 'comments-rail-marker', { count: view().count, block: label })
                    }">
      <span class="lucide lucide-message-circle rail-icon" aria-hidden="true"></span>
      <span class="rail-count" data-bind="text: view().count"></span>
    </button>
    <!-- /ko -->
  </div>
  <!-- /ko -->

  <!-- Panel rail (ADR 0020): one button per right panel, below the top bar on
       the right edge. Its own place, out of #main-edit-area, whose click
       unselects the block. One aria-controls per panel: the right panel binding
       gives the focus back to it on close. -->
  <nav class="panel-rail" data-bind="attr: { 'aria-label': $root.t('panel-rail-label') }, tooltips: {}">
    <!-- ko if: typeof $root.showComments !== 'undefined' -->
    <button id="comments-toggle" type="button" class="panel-rail__button" aria-controls="toolcomments" data-bind="click: function() { $root.showComments(!$root.showComments()); }, clickBubble: false, attr: { title: $root.t('comments-title'), 'aria-expanded': $root.showComments() ? 'true' : 'false' }">
      <span class="lucide lucide-messages-square" aria-hidden="true"></span>
      <span class="panel-rail__sr" data-bind="text: $root.t('comments-title')"></span>
      <!-- ko if: $root.unresolvedCommentCount && $root.unresolvedCommentCount() > 0 -->
      <span class="panel-rail__badge panel-rail__badge--volume">
        <span aria-hidden="true" data-bind="text: $root.unresolvedCommentCount()"></span>
        <span class="panel-rail__sr" data-bind="text: $root.t('panel-rail-unresolved', { count: $root.unresolvedCommentCount() })"></span>
      </span>
      <!-- /ko -->
    </button>
    <!-- /ko -->
    <!-- ko if: typeof $root.showQuality !== 'undefined' -->
    <button id="quality-toggle" type="button" class="panel-rail__button" aria-controls="toolquality" data-bind="click: function() { $root.showQuality(!$root.showQuality()); }, clickBubble: false, attr: { title: $root.t('Test email'), 'aria-expanded': $root.showQuality() ? 'true' : 'false' }">
      <span class="lucide lucide-shield-check" aria-hidden="true"></span>
      <span class="panel-rail__sr" data-bind="text: $root.t('Test email')"></span>
      <!-- ko template: { name: 'panel-rail-quality-badge' } --><!-- /ko -->
    </button>
    <!-- /ko -->
    <!-- ko if: $root.metadata.canUseTextGeneration && typeof $root.showAi !== 'undefined' -->
    <button id="ai-toggle" type="button" class="panel-rail__button" aria-controls="toolai" data-bind="click: function() { $root.showAi(!$root.showAi()); }, clickBubble: false, attr: { title: $root.t('ai-panel-title'), 'aria-expanded': $root.showAi() ? 'true' : 'false' }">
      <span class="lucide lucide-wand-2" aria-hidden="true"></span>
      <span class="panel-rail__sr" data-bind="text: $root.t('ai-panel-title')"></span>
    </button>
    <!-- /ko -->
  </nav>

  <div id="toolbar" class="mo" data-bind="tooltips: {}">


    <!-- ko template: {name: 'edit-name' } --># creation name #<!-- /ko -->

    <input id="previewBoth" type="radio" name="previewMode" value="both" data-bind="checked: $root.previewMode, button: { text: false, label: 'both', icons: { primary: 'lucide lucide-fw lucide-columns-2' } }">
      <label for="previewBoth" title="Both screen" data-bind="attr: { title: $root.t('Mobile and desktop') }">Mobile and desktop</label>
    </input>
    <input id="previewDesktop" type="radio" name="previewMode" value="desktop" data-bind="checked: $root.previewMode, button: { text: false, label: 'desktop', icons: { primary: 'lucide lucide-fw lucide-monitor' } }">
      <label for="previewDesktop" title="Desktop" data-bind="attr: { title: $root.t('Desktop') }">Desktop</label>
    </input>
    <input id="previewMobile" type="radio" name="previewMode" value="mobile" data-bind="checked: $root.previewMode, button: { text: false, label: 'mobile', icons: { primary: 'lucide lucide-fw lucide-smartphone' } }">
      <label for="previewMobile" title="Smartphone" data-bind="attr: { title: $root.t('Smartphone') }">Smartphone</label>
    </input>

    <span>
      <input id="showGallery" type="checkbox" data-bind="checked: $root.showGallery, button: { refreshOn: $root.showGallery, icons: { primary: 'lucide lucide-fw lucide-image', secondary: null }, text: false, label: $root.t('Gallery') }"><label title="Show image gallery" for="showGallery" data-bind="attr: { title: $root.t('Show image gallery') }">show gallery</label></input>
    </span>
    <!-- ko if: typeof $root.undo != 'undefined' -->
    <span class="leftButtons">
      <span class="undo-button-wrapper">
        <a title="Undo last operation" href="javascript:void(0)" data-bind="attr: { title: $root.t('Undo last operation') }, click: $root.undo.execute, clickBubble: false, button: { disabled: !$root.undo.enabled(), icons: { primary: 'lucide lucide-undo' }, label: $root.undo.name, text: false}">UNDO</a>
        <!-- ko if: $root.undoCount && $root.undoCount() > 0 -->
        <span class="undo-count-badge" data-bind="text: $root.undoCount()"></span>
        <!-- /ko -->
      </span>
      <span class="undo-button-wrapper">
        <a title="Redo last operation" href="javascript:void(0)" data-bind="attr: { title: $root.t('Redo last operation') }, click: $root.redo.execute, clickBubble: false, button: { disabled: !$root.redo.enabled(), icons: { primary: 'lucide lucide-redo' }, label: $root.redo.name, text: false}">REDO</a>
        <!-- ko if: $root.redoCount && $root.redoCount() > 0 -->
        <span class="undo-count-badge" data-bind="text: $root.redoCount()"></span>
        <!-- /ko -->
      </span>
    </span>
    <!-- ko if: $root.debug -->
    <a href="javascript:void(0)" data-bind="click: $root.undoReset, clickBubble: false, button: { disabled: !$root.undo.enabled() && !$root.redo.enabled(), label: 'reset', text: true }">RESET</a>
    <!-- /ko -->
    <!-- /ko -->

    <!-- ko if: $root.debug -->
    <a href="javascript:void(0)" data-bind="click: $root.export, clickBubble: false, button: { label: 'export', text: true }">EXPORT</a>
    <input type="checkbox" data-bind="checked: $root.debug" /> debug
    <a href="javascript:void(0)" data-bind="click: $root.loadDefaultBlocks, clickBubble: false, button: { icons: { primary: 'lucide lucide-fw lucide-upload' }, label: 'Default', text: true }">LOAD BLOCKS</a>
    [<a id="subscriptionsCount" href="javascript:viewModel.loopSubscriptionsCount()">subs</a>]
    <!-- /ko -->

    <span data-bind="visible: false">
    <input type="checkbox" data-bind="checked: $root.showToolbox" /> toolbox
    </span>

    <div class="rightButtons">

    <!-- ko if: typeof $root.save !== 'undefined' -->
    <a class="primaryButton" title="Save template" href="javascript:void(0)" data-bind="attr: { title: $root.t('Save template') }, click: function() { if ($root.canSave()) $root.save.execute(); }, clickBubble: false, button: { disabled: !$root.save.enabled() || !$root.canSave(), icons: { primary: 'lucide lucide-fw lucide-cloud-upload' }, label: $root.t($root.save.name), text: true }">SALVA</a>
    <!-- /ko -->
    <!-- ko template: {name: 'download-buttons' } --># download buttons #<!-- /ko -->
    </div>
  </div>

  <!-- ko template: {name: 'dialog-select-image' } --># dialog image selection #<!-- /ko -->

  <!-- ko if: $root.showToolbox -->
  <div id="main-toolbox" class="mo" data-bind="scrollable: true, withProperties: { templateMode: 'edit' }">
    <div data-bind="template: { name: 'toolbox' }"></div>
  </div>
  <!-- /ko -->

  <!-- <div id="main-preview" class="mo" data-bind="scrollable: true, if: $root.showPreviewFrame">
    <div id="preview-toolbar">
      <div data-bind="visible: $root.showPreviewFrame, buttonset: { }" style="display: inline-block">
        <input id="previewLarge" type="radio" name="previewMode" value="large" data-bind="checked: $root.previewMode, button: { text: false, label: 'large', icons: { primary: 'lucide lucide-fw lucide-monitor' } }" />
        <label for="previewLarge" title="Large screen" data-bind="attr: { title: $root.t('Large screen') }">Large screen</label>
        <input id="previewDesktop" type="radio" name="previewMode" value="desktop" data-bind="checked: $root.previewMode, button: { text: false, label: 'desktop', icons: { primary: 'lucide lucide-fw lucide-tablet' } }" />
        <label for="previewDesktop" title="Tablet" data-bind="attr: { title: $root.t('Tablet') }">Tablet</label>
        <input id="previewMobile" type="radio" name="previewMode" value="mobile" data-bind="checked: $root.previewMode, button: { text: false, label: 'mobile', icons: { primary: 'lucide lucide-fw lucide-smartphone' } }" />

  <div class="mo" id="mo-body"></div>

  <div id="incompatible-template" title="Saved model is obsolete" style="display: none" data-bind="attr: { title: $root.t('Saved model is obsolete') }, html: $root.t('<p>The saved model has been created with a previous, non completely compatible version, of the template</p><p>Some content or style in the model <b>COULD BE LOST</b> if you will <b>save</b></p><p>Contact us for more informations!</p>')">
    Incompatible template
  </div>

  <div id="fake-image-editor" title="Fake image editor" style="display: none" data-bind="attr: { title: $root.t('Fake image editor') }, html: $root.t('<p>Fake image editor</p>')">
    <p>Fake image editor</p>
  </div>

</div>

<!-- ko if: $root.logoPath -->
<div id="loading" class="loading" style="display: block; width: 300px; text-align: center; height: 32px; position: absolute; top:0; bottom: 0; left: 0; right: 0;  margin: auto;" data-bind="attr: { style: 'position: absolute; top: 5px; left: 6px; z-index: 150;'}, css: { loading: false }">
  <a href="/" data-bind="attr: { href: $root.logoUrl, alt: $root.logoAlt }"><img data-bind="attr: { src: $root.logoPath }" width="32" height="32" alt="mosaico" border="0" /></a>
  <div style="opacity: 0" data-bind="visible: false">Oppps... !!</div>
</div>
<!-- /ko -->
